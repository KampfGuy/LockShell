<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LockShell</title>
<meta name="description" content="LockShell: a kiosk-style lock screen and home screen of safe apps for iPhone.">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LockShell">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>try{var s=JSON.parse(localStorage.getItem('lockshell.settings.v2')||'{}');if(s.theme==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
<div id="root">
  <!-- LOCK SCREEN -->
  <section id="lock" class="screen active" aria-label="Lock screen">
    <div class="statusbar"><span class="sb-time"></span><span class="sb-right"><span class="sb-mic" hidden title="Listening for Buddy">Buddy</span><span class="sb-batt" hidden></span></span></div>
    <div class="lock-clock">
      <div class="lock-glyph" id="lockGlyph"></div>
      <div class="clock-date" id="clockDate"></div>
      <div class="clock-time" id="clockTime">12:00</div>
    </div>
    <div class="lock-entry">
      <p class="pin-sub" id="lockSub">Enter passcode</p>
      <div class="pin-dots" id="lockDots"></div>
      <div id="lockPad"></div>
    </div>
  </section>

  <!-- HOME SCREEN -->
  <section id="home" class="screen" aria-label="Home screen">
    <div class="statusbar"><span class="sb-time"></span><span class="sb-right"><span class="sb-mic" hidden title="Listening for Buddy">Buddy</span><span class="sb-batt" hidden></span></span></div>
    <div class="home-head">
      <div>
        <div class="home-date" id="homeDate"></div>
        <h1 class="home-title">Home</h1>
      </div>
      <button class="lock-btn" id="homeLock" aria-label="Lock"></button>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="dock-hint" id="dockHint">Tap 🔒 to lock before handing the phone back</div>
  </section>

  <!-- APP SCREEN -->
  <section id="appScreen" class="screen" aria-label="App">
    <header class="app-bar">
      <button class="back-btn" id="appBack" aria-label="Back"></button>
      <h1 id="appTitle">App</h1>
      <div class="app-actions" id="appActions"></div>
    </header>
    <main class="app-body" id="appBody"></main>
  </section>
</div>

<div id="pinOverlay" class="overlay pin-overlay" hidden></div>
<div id="modal" class="overlay" hidden><div class="sheet" id="modalSheet"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="flash"></div>

<script src="js/core.js"></script>
<script src="js/buddy-brain.js"></script>
<script src="js/buddy.js"></script>
<script src="js/camera.js"></script>
<script src="js/recorder.js"></script>
<script src="js/notes.js"></script>
<script src="js/weather.js"></script>
<script src="js/games.js"></script>
<script src="js/tools.js"></script>
<script src="js/settings.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
