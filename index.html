<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ShellOS</title>
<meta name="description" content="ShellOS: a kid-safe, kiosk-style lock screen and home screen of safe apps for iPhone.">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShellOS">
<meta name="application-name" content="ShellOS">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/shell-filter.js"></script>
<script>
/* Theme before paint, and a Content-Security-Policy that only lets frames load the allowed kid sites and the
   YouTube app's player (youtube-nocookie.com only; youtube.com itself is never allowed in a frame).
   frame-src also stops an allowed site from navigating its own frame to any other website. */
(function () {
  var s = {}, hosts = [];
  try { s = JSON.parse(localStorage.getItem('lockshell.settings.v4') || localStorage.getItem('lockshell.settings.v3') || localStorage.getItem('lockshell.settings.v2') || '{}') || {}; } catch (e) {}
  if (s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  try {
    var sh = s.shell || {}, off = sh.removedSites || [];
    hosts = ShellFilter.SITES.map(function (x) { return x.host; }).filter(function (h) { return off.indexOf(h) < 0; }).concat(sh.addSites || []);
    hosts = hosts.filter(function (h) { return typeof h === 'string' && /^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(h); });
  } catch (e) { hosts = []; }
  var src = [];
  hosts.forEach(function (h) { var b = h.replace(/^www\./, ''); if (/(^|\.)youtube\.com$|(^|\.)youtu\.be$/.test(b)) return; src.push('https://' + b, 'https://www.' + b); });
  src.push('https://www.youtube-nocookie.com');
  var m = document.createElement('meta'); m.httpEquiv = 'Content-Security-Policy';
  m.content = 'frame-src ' + src.join(' ') + "; object-src 'none'; form-action 'self'";
  document.head.appendChild(m);
  window.SHELL_FRAME_HOSTS = hosts;
})();
</script>
</head>
<body>
<div id="root">
  <!-- LOCK SCREEN -->
  <section id="lock" class="screen active" aria-label="Lock screen">
    <div class="statusbar"><span class="sb-time"></span><span class="sb-right"><span class="sb-mic" hidden title="Listening for Buddy">Buddy</span><span class="sb-batt" hidden></span></span></div>
    <div class="lock-clock">
      <div class="lock-glyph" id="lockGlyph"></div>
      <div class="lock-brand">ShellOS</div>
      <div class="lock-limit" id="lockLimit" hidden></div>
      <div class="clock-date" id="clockDate"></div>
      <div class="clock-time" id="clockTime">12:00</div>
    </div>
    <div class="lock-entry">
      <p class="pin-sub" id="lockSub">Enter passcode</p>
      <div class="pin-dots" id="lockDots"></div>
      <div id="lockPad"></div>
    </div>
  </section>

  <!-- HOME SCREEN -->
  <section id="home" class="screen" aria-label="Home screen">
    <div class="statusbar"><span class="sb-time"></span><span class="sb-right"><span class="sb-mic" hidden title="Listening for Buddy">Buddy</span><span class="sb-batt" hidden></span></span></div>
    <div class="home-head">
      <div>
        <div class="home-date" id="homeDate"></div>
        <h1 class="home-title">Home</h1>
      </div>
      <button class="lock-btn" id="homeLock" aria-label="Lock"></button>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="dock-hint" id="dockHint">Tap 🔒 to lock before handing it back</div>
    <button class="voice-fab" id="voiceFab" aria-label="Talk to Buddy"></button>
  </section>

  <!-- APP SCREEN -->
  <section id="appScreen" class="screen" aria-label="App">
    <header class="app-bar">
      <button class="back-btn" id="appBack" aria-label="Back"></button>
      <h1 id="appTitle">App</h1>
      <div class="app-actions" id="appActions"></div>
    </header>
    <main class="app-body" id="appBody"></main>
  </section>
</div>

<div id="timeUp" class="overlay time-up" hidden role="dialog" aria-label="Screen time"></div>
<div id="pinOverlay" class="overlay pin-overlay" hidden></div>
<div id="modal" class="overlay" hidden><div class="sheet" id="modalSheet"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="flash"></div>

<script src="js/core.js"></script>
<script src="js/buddy-brain.js"></script>
<script src="js/buddy.js"></script>
<script src="js/voice.js"></script>
<script src="js/camera.js"></script>
<script src="js/recorder.js"></script>
<script src="js/notes.js"></script>
<script src="js/weather.js"></script>
<script src="js/games.js"></script>
<script src="js/games2.js"></script>
<script src="js/games3.js"></script>
<script src="js/tools.js"></script>
<script src="js/apps2.js"></script>
<script src="js/shell.js"></script>
<script src="js/yt-library.js"></script>
<script src="js/youtube.js"></script>
<script src="js/photos.js"></script>
<script src="js/stories-data.js"></script>
<script src="js/stories.js"></script>
<script src="js/quiz-data.js"></script>
<script src="js/quiz.js"></script>
<script src="js/settings.js"></script>
<script src="js/dev.js"></script>
<script src="js/screentime.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
